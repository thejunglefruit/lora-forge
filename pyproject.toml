[project]
name = "lora-forge"
version = "0.1.0"
description = "Dataset + LoRA training orchestrator (not a trainer: it wraps ai-toolkit)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Only installed on the GPU box. The local core does not need them.
pod = [
    "opencv-python",   # face detection (Haar cascade)
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",     # FastAPI TestClient
]

[project.scripts]
forge = "forge_cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forge_core", "forge_core.caption", "forge_cli"]

[tool.setuptools.package-data]
forge_core = ["models.json"]
